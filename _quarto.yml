      style: docked
      contents:
        - fase-01-strogatz/index.qmd
        - fase-01-strogatz/01-fluxos-1d/intro.qmd
        - fase-01-strogatz/02-bifurcacoes-1d/intro.qmd
        - fase-01-strogatz/03-fluxos-2d/intro.qmd
        - fase-01-strogatz/04-ciclos-limite/intro.qmd
        - fase-01-strogatz/05-bifurcacoes-2d/intro.qmd
        - fase-01-strogatz/06-caos-lorenz/intro.qmd
    - title: "Fase 2"
      style: docked
      contents:
        - fase-02-markov/index.qmd
        - fase-02-markov/01-cadeias-finitas/intro.qmd
        - fase-02-markov/02-distribuicoes-estacionarias/intro.qmd
        - fase-02-markov/03-reversibilidade-mcmc/intro.qmd
        - fase-02-markov/04-tempo-continuo/intro.qmd
        - fase-02-markov/05-aplicacoes-algoritmicas/intro.qmd
