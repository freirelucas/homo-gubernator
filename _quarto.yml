      style: docked
      contents:
        - fase-03-sterman/index.qmd
        - fase-03-sterman/01-fundamentos-sd/intro.qmd
        - fase-03-sterman/02-feedback-loops/intro.qmd
        - fase-03-sterman/03-modelagem-formal/intro.qmd
        - fase-03-sterman/04-validacao/intro.qmd
    - title: "Fase 4"
      style: docked
      contents:
        - fase-04-sintese/index.qmd
        - fase-04-sintese/01-vsm-ashby-beer/intro.qmd
        - fase-04-sintese/02-bacia-formoso-caso/intro.qmd
        - fase-04-sintese/03-aplicacao-propria/intro.qmd
format:
  html:
    theme:
      - cosmo
      - styles/custom.scss
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    mainfont: "Inter"
    monofont: "JuliaMono"
    fontsize: 1.05em
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
bibliography: bibliografia.bib
csl: https://www.zotero.org/styles/associacao-brasileira-de-normas-tecnicas
lang: pt-BR
