    toc-depth: 3
    code-fold: false
    mainfont: "Inter"
    monofont: "JuliaMono"
    fontsize: 1.05em
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
