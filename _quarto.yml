  description: "Curso de auto-estudo de 24 semanas em sistemas dinâmicos, Markov, Business Dynamics e VSM."
  navbar:
    background: "#1F3A4D"
    foreground: "#FAF8F2"
    left:
      - href: index.qmd
        text: Início
      - href: como-estudar.qmd
        text: Como estudar
      - href: metatexto/viable-os.qmd
        text: ViableOS
      - href: personagem-narrativo.qmd
        text: Personagem
      - href: plano/plano-estudos.qmd
        text: Plano
      - href: fase-01-strogatz/index.qmd
        text: Fase 1
      - href: fase-02-markov/index.qmd
        text: Fase 2
      - href: fase-03-sterman/index.qmd
        text: Fase 3
      - href: fase-04-sintese/index.qmd
        text: Fase 4
      - href: glossario.qmd
        text: Glossário
      - href: revisao/index.qmd
        text: Revisão
      - href: recursos/index.qmd
        text: Recursos
