<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Inter, sans-serif">
  <rect width="600" height="320" fill="#FAF8F2"/>

  <defs>
    <marker id="arrCA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A4D"/>
    </marker>
  </defs>

  <!-- D — distúrbios -->
  <ellipse cx="80" cy="160" rx="50" ry="50" fill="#E8A33D" opacity="0.4" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="80" y="155" font-size="20" font-weight="bold" fill="#1A1A1A" text-anchor="middle">D</text>
  <text x="80" y="178" font-size="10" fill="#1A1A1A" text-anchor="middle">distúrbios</text>

  <!-- S — sistema -->
  <ellipse cx="300" cy="100" rx="60" ry="50" fill="#3F6B85" opacity="0.5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="300" y="95" font-size="20" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S</text>
  <text x="300" y="118" font-size="10" fill="#FAF8F2" text-anchor="middle">sistema</text>

  <!-- R — regulador -->
  <ellipse cx="300" cy="220" rx="60" ry="50" fill="#D45A1A" opacity="0.6" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="300" y="215" font-size="20" font-weight="bold" fill="#FAF8F2" text-anchor="middle">R</text>
  <text x="300" y="238" font-size="10" fill="#FAF8F2" text-anchor="middle">regulador</text>

  <!-- E — essencial-a-preservar -->
  <ellipse cx="520" cy="160" rx="50" ry="50" fill="#1F3A4D" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="520" y="155" font-size="20" font-weight="bold" fill="#FAF8F2" text-anchor="middle">E</text>
  <text x="520" y="178" font-size="10" fill="#FAF8F2" text-anchor="middle">essencial</text>

  <!-- D → S (g) -->
  <path d="M 130 145 Q 200 110 240 102" stroke="#1F3A4D" stroke-width="2" fill="none" marker-end="url(#arrCA)"/>
  <text x="170" y="100" font-size="14" fill="#1F3A4D" font-style="italic">g</text>

  <!-- D → R (f) -->
  <path d="M 130 175 Q 200 200 240 218" stroke="#1F3A4D" stroke-width="2" fill="none" marker-end="url(#arrCA)"/>
  <text x="170" y="225" font-size="14" fill="#1F3A4D" font-style="italic">f</text>

  <!-- S → E (output) -->
  <path d="M 360 100 Q 430 130 470 150" stroke="#1F3A4D" stroke-width="2" fill="none" marker-end="url(#arrCA)"/>

  <!-- R → S (regulação) -->
  <path d="M 300 170 L 300 150" stroke="#D45A1A" stroke-width="2.5" fill="none" marker-end="url(#arrCA)"/>

  <!-- R → E -->
  <path d="M 360 220 Q 430 200 470 175" stroke="#1F3A4D" stroke-width="2" fill="none" marker-end="url(#arrCA)"/>

  <!-- Texto principal -->
  <text x="300" y="35" font-size="16" fill="#1F3A4D" text-anchor="middle" font-style="italic">Conant-Ashby (1970): R bem-regulando ⟹ f homomorfo a g</text>
  <text x="300" y="285" font-size="12" fill="#1A1A1A" text-anchor="middle">A estrutura informacional do regulador eficaz espelha a do sistema regulado.</text>
  <text x="300" y="302" font-size="11" fill="#1A1A1A" text-anchor="middle" font-style="italic">"Todo bom regulador de um sistema deve ser um modelo desse sistema."</text>
</svg>
