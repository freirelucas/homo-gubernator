<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="Inter, sans-serif">
  <rect width="700" height="520" fill="#FAF8F2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A4D"/>
    </marker>
    <marker id="arrowAlg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D45A1A"/>
    </marker>
  </defs>

  <!-- Ambiente -->
  <ellipse cx="80" cy="320" rx="50" ry="180" fill="#E8A33D" opacity="0.2" stroke="#1A1A1A" stroke-dasharray="4,3" stroke-width="1"/>
  <text x="55" y="510" font-size="13" fill="#1A1A1A" font-style="italic">Ambiente</text>

  <!-- S5 -->
  <rect x="450" y="40" width="140" height="60" rx="6" fill="#1F3A4D" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="520" y="68" font-size="14" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S5</text>
  <text x="520" y="88" font-size="11" fill="#FAF8F2" text-anchor="middle">política / identidade</text>

  <!-- S4 -->
  <rect x="450" y="140" width="140" height="60" rx="6" fill="#3F6B85" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="520" y="168" font-size="14" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S4</text>
  <text x="520" y="188" font-size="11" fill="#FAF8F2" text-anchor="middle">fora-e-depois</text>

  <!-- S3 -->
  <rect x="450" y="240" width="140" height="60" rx="6" fill="#3F6B85" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="520" y="268" font-size="14" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S3</text>
  <text x="520" y="288" font-size="11" fill="#FAF8F2" text-anchor="middle">aqui-agora</text>

  <!-- S3* (auditoria) -->
  <rect x="610" y="265" width="70" height="40" rx="6" fill="#FAF8F2" stroke="#1F3A4D" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="645" y="285" font-size="13" font-weight="bold" fill="#1F3A4D" text-anchor="middle">S3*</text>
  <text x="645" y="298" font-size="9" fill="#1F3A4D" text-anchor="middle">auditoria</text>

  <!-- S2 (lateral) -->
  <rect x="280" y="320" width="100" height="50" rx="6" fill="#E8A33D" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="330" y="345" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">S2</text>
  <text x="330" y="360" font-size="10" fill="#1A1A1A" text-anchor="middle">antioscilação</text>

  <!-- S1 unidades operacionais -->
  <g>
    <circle cx="200" cy="180" r="32" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="200" y="186" font-size="14" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="200" y="225" font-size="10" fill="#1A1A1A" text-anchor="middle">operação a</text>
  </g>
  <g>
    <circle cx="200" cy="290" r="32" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="200" y="296" font-size="14" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="200" y="335" font-size="10" fill="#1A1A1A" text-anchor="middle">operação b</text>
  </g>
  <g>
    <circle cx="200" cy="400" r="32" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="200" y="406" font-size="14" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="200" y="445" font-size="10" fill="#1A1A1A" text-anchor="middle">operação c</text>
  </g>

  <!-- Canais S3 ↔ S1 -->
  <path d="M 232 185 L 450 270" stroke="#1F3A4D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 232 290 L 450 280" stroke="#1F3A4D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 232 395 L 450 290" stroke="#1F3A4D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- S2 conecta laterais entre S1s -->
  <path d="M 280 345 Q 240 370 232 405" stroke="#E8A33D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 340 Q 240 320 232 295" stroke="#E8A33D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 335 Q 230 240 232 195" stroke="#E8A33D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- S3 ↔ S4 -->
  <path d="M 520 240 L 520 200" stroke="#1F3A4D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 530 200 L 530 240" stroke="#1F3A4D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- S4 ↔ S5 -->
  <path d="M 520 140 L 520 100" stroke="#1F3A4D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- S3* ↔ S1 (auditoria esporádica) -->
  <path d="M 610 285 Q 400 460 232 405" stroke="#1F3A4D" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

  <!-- Sinal algedônico (S1 → S5 direto) -->
  <path d="M 195 158 Q 320 60 510 65" stroke="#D45A1A" stroke-width="2.5" fill="none" marker-end="url(#arrowAlg)"/>
  <text x="320" y="50" font-size="11" fill="#D45A1A" font-style="italic">canal algedônico</text>

  <!-- Ambiente → S1 (entrada de distúrbios) -->
  <path d="M 130 280 L 168 285" stroke="#1A1A1A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Etiqueta -->
  <text x="350" y="500" font-size="11" fill="#1A1A1A" text-anchor="middle" font-style="italic">Cinco subsistemas e canais. Setas amarelas: S2 lateral. Vermelha: algedônico vertical.</text>
</svg>
