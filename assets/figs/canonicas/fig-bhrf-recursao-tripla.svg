<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="Inter, sans-serif">
  <rect width="700" height="460" fill="#FAF8F2"/>

  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A4D"/>
    </marker>
  </defs>

  <!-- Recursão 3 — sistema federal (caixa externa) -->
  <rect x="20" y="20" width="660" height="420" rx="12" fill="none" stroke="#1F3A4D" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#1F3A4D">Recursão 3 — Sistema Federal (ANA, MMA, Política Nacional Recursos Hídricos)</text>
  <text x="40" y="58" font-size="10" fill="#1A1A1A" font-style="italic">S5 federal e estadual operam com critérios distintos — duplicidade.</text>

  <!-- Recursão 2 — bacia hidrográfica estadual -->
  <rect x="50" y="80" width="600" height="340" rx="10" fill="none" stroke="#3F6B85" stroke-width="2"/>
  <text x="70" y="102" font-size="13" font-weight="bold" fill="#3F6B85">Recursão 2 — Bacia Hidrográfica do Rio Formoso (Naturatins, MPTO, GAN)</text>
  <text x="70" y="118" font-size="10" fill="#1A1A1A" font-style="italic">S2 inter-outorgantes era ausente; GAN preenche parcialmente desde 2018-2020.</text>

  <!-- Recursão 1 — usuários (caixa interna) -->
  <rect x="80" y="140" width="540" height="270" rx="8" fill="#FAF8F2" stroke="#D45A1A" stroke-width="2"/>
  <text x="100" y="162" font-size="13" font-weight="bold" fill="#D45A1A">Recursão 1 — Outorgas individuais (rizicultura, abastecimento, dessedentação)</text>

  <!-- S1s da recursão 1 (outorgas) -->
  <g>
    <circle cx="160" cy="240" r="30" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="160" y="244" font-size="11" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="160" y="285" font-size="9" fill="#1A1A1A" text-anchor="middle">irrigação</text>
  </g>
  <g>
    <circle cx="270" cy="240" r="30" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="270" y="244" font-size="11" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="270" y="285" font-size="9" fill="#1A1A1A" text-anchor="middle">abastecimento</text>
  </g>
  <g>
    <circle cx="380" cy="240" r="30" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="380" y="244" font-size="11" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="380" y="285" font-size="9" fill="#1A1A1A" text-anchor="middle">dessedentação</text>
  </g>
  <g>
    <circle cx="490" cy="240" r="30" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="490" y="244" font-size="11" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S1</text>
    <text x="490" y="285" font-size="9" fill="#1A1A1A" text-anchor="middle">indústria</text>
  </g>

  <!-- GAN (S2 inter-outorgantes) -->
  <rect x="220" y="320" width="200" height="50" rx="6" fill="#E8A33D" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="320" y="342" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">GAN — S2 inter-outorgantes</text>
  <text x="320" y="358" font-size="10" fill="#1A1A1A" text-anchor="middle">criado em 2018-2020 com apoio UFT</text>

  <!-- Setas S2 → S1s -->
  <path d="M 240 320 Q 200 290 175 268" stroke="#E8A33D" stroke-width="1.2" fill="none" marker-end="url(#arrB)"/>
  <path d="M 270 320 Q 270 290 270 268" stroke="#E8A33D" stroke-width="1.2" fill="none" marker-end="url(#arrB)"/>
  <path d="M 360 320 Q 380 290 380 268" stroke="#E8A33D" stroke-width="1.2" fill="none" marker-end="url(#arrB)"/>
  <path d="M 400 320 Q 460 290 487 268" stroke="#E8A33D" stroke-width="1.2" fill="none" marker-end="url(#arrB)"/>

  <!-- S3 estadual (Naturatins) -->
  <rect x="540" y="225" width="100" height="40" rx="6" fill="#3F6B85" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="590" y="248" font-size="11" font-weight="bold" fill="#FAF8F2" text-anchor="middle">S3</text>
  <text x="590" y="262" font-size="9" fill="#FAF8F2" text-anchor="middle">Naturatins</text>

  <!-- S4 ausente -->
  <rect x="540" y="170" width="100" height="40" rx="6" fill="#FAF8F2" stroke="#D45A1A" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="590" y="190" font-size="11" font-weight="bold" fill="#D45A1A" text-anchor="middle">S4 ausente</text>
  <text x="590" y="204" font-size="8" fill="#D45A1A" text-anchor="middle">inteligência climática</text>

  <!-- MPTO -->
  <rect x="100" y="370" width="120" height="35" rx="6" fill="#1F3A4D" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="160" y="392" font-size="11" font-weight="bold" fill="#FAF8F2" text-anchor="middle">MPTO (ACP 2016)</text>

  <!-- Identificação -->
  <text x="660" y="448" font-size="9" fill="#1A1A1A" text-anchor="end" font-style="italic">Diagnóstico VSM em recursão tripla — Alves (2022)</text>
</svg>
