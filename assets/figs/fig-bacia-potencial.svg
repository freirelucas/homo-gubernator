<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Inter, sans-serif">
  <!-- Paleta Cybersyn-Cerrado -->
  <!-- D45A1A laranja-queimado, 3F6B85 azul-rio, E8A33D ocre, 1F3A4D azul-petróleo, 1A1A1A grafite, FAF8F2 osso -->
  <rect width="600" height="320" fill="#FAF8F2"/>

  <!-- Eixos -->
  <line x1="60"  y1="260" x2="560" y2="260" stroke="#1A1A1A" stroke-width="1.2"/>
  <line x1="60"  y1="40"  x2="60"  y2="260" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="570" y="265" font-size="14" fill="#1A1A1A">N</text>
  <text x="40"  y="40"  font-size="14" fill="#1A1A1A">V(N)</text>

  <!-- Curva do potencial V(N) = -rN²/2 + rN³/(3K), com r=0.5, K=400 -->
  <!-- Domínio: N ∈ [0, 500]; mapeamos x=60+N*1.0 -->
  <!-- Mínimo local em N=K=400 → x=460; raiz extra em 600 -->
  <path d="M 60 260
           Q 110 200 160 165
           Q 230 130 300 105
           Q 360 100 410 115
           Q 450 135 460 165
           Q 470 200 490 240
           Q 510 260 540 200
           L 555 100"
        stroke="#1F3A4D" stroke-width="2.5" fill="none"/>

  <!-- Bola descendo: posição inicial em N=200 (x=260), final em N=400 (x=460) -->
  <circle cx="260" cy="135" r="9" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="320" cy="115" r="9" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1" opacity="0.5"/>
  <circle cx="380" cy="108" r="9" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1" opacity="0.35"/>
  <circle cx="430" cy="120" r="9" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1" opacity="0.25"/>
  <circle cx="460" cy="165" r="11" fill="#D45A1A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Setas indicando descenso -->
  <path d="M 270 145 L 308 121" stroke="#3F6B85" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 330 121 L 366 109" stroke="#3F6B85" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 390 110 L 420 122" stroke="#3F6B85" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 440 130 L 458 156" stroke="#3F6B85" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F6B85"/>
    </marker>
  </defs>

  <!-- Marcações dos pontos fixos -->
  <line x1="60"  y1="255" x2="60"  y2="270" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="48" y="285" font-size="12" fill="#1A1A1A">N*=0</text>
  <text x="34" y="298" font-size="11" fill="#D45A1A" font-style="italic">instável</text>

  <line x1="460" y1="255" x2="460" y2="270" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="445" y="285" font-size="12" fill="#1A1A1A">N*=K</text>
  <text x="438" y="298" font-size="11" fill="#1F3A4D" font-style="italic">estável</text>

  <!-- Legenda da bola -->
  <text x="200" y="60" font-size="13" fill="#1F3A4D" font-style="italic">trajetória</text>
  <text x="200" y="76" font-size="11" fill="#3F6B85">N(t) → K conforme t cresce</text>
</svg>
