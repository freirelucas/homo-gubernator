<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" font-family="Inter, sans-serif">
  <rect width="600" height="200" fill="#FAF8F2"/>

  <!-- Eixo x principal -->
  <line x1="40" y1="100" x2="560" y2="100" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="568" y="105" font-size="14" fill="#1A1A1A">x</text>

  <!-- Sistema: dot{x} = x - x³ -->
  <!-- Pontos fixos: x*=-1 (estável, x=180), x*=0 (instável, x=300), x*=+1 (estável, x=420) -->
  <!-- Sinal de f: (-∞,-1) f>0; (-1,0) f<0; (0,+1) f>0; (+1,∞) f<0 -->
  <!-- Setas convergem para os estáveis -->

  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D45A1A"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#D45A1A"/>
    </marker>
  </defs>

  <!-- Em (-∞, -1): f>0 → seta para direita, em direção a -1 -->
  <path d="M 80 100 L 155 100" stroke="#D45A1A" stroke-width="2" marker-end="url(#arrR)"/>
  <!-- Em (-1, 0): f<0 → seta para esquerda, em direção a -1 -->
  <path d="M 270 100 L 215 100" stroke="#D45A1A" stroke-width="2" marker-end="url(#arrL)"/>
  <!-- Em (0, +1): f>0 → seta para direita, em direção a +1 -->
  <path d="M 330 100 L 395 100" stroke="#D45A1A" stroke-width="2" marker-end="url(#arrR)"/>
  <!-- Em (+1, ∞): f<0 → seta para esquerda, em direção a +1 -->
  <path d="M 520 100 L 455 100" stroke="#D45A1A" stroke-width="2" marker-end="url(#arrL)"/>

  <!-- Pontos fixos -->
  <!-- x=-1: estável (círculo cheio azul-petróleo) -->
  <circle cx="180" cy="100" r="10" fill="#1F3A4D" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="170" y="135" font-size="13" fill="#1A1A1A">x*=−1</text>
  <text x="166" y="150" font-size="11" fill="#1F3A4D" font-style="italic">estável</text>

  <!-- x=0: instável (círculo branco com borda) -->
  <circle cx="300" cy="100" r="9" fill="#FAF8F2" stroke="#1A1A1A" stroke-width="2"/>
  <text x="293" y="135" font-size="13" fill="#1A1A1A">x*=0</text>
  <text x="288" y="150" font-size="11" fill="#D45A1A" font-style="italic">instável</text>

  <!-- x=+1: estável (círculo cheio azul-petróleo) -->
  <circle cx="420" cy="100" r="10" fill="#1F3A4D" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="408" y="135" font-size="13" fill="#1A1A1A">x*=+1</text>
  <text x="406" y="150" font-size="11" fill="#1F3A4D" font-style="italic">estável</text>

  <text x="40" y="40" font-size="15" fill="#1F3A4D" font-style="italic">ẋ = x − x³</text>
  <text x="40" y="58" font-size="11" fill="#1A1A1A">setas seguem o sinal de f(x); convergem aos estáveis</text>

  <!-- Bacias de atração (rótulos discretos sob o eixo) -->
  <text x="100" y="80" font-size="11" fill="#3F6B85" font-style="italic">bacia(−1) = (−∞, 0)</text>
  <text x="380" y="80" font-size="11" fill="#3F6B85" font-style="italic">bacia(+1) = (0, +∞)</text>
</svg>
