<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Inter, sans-serif">
  <rect width="600" height="320" fill="#FAF8F2"/>

  <!-- Eixos -->
  <line x1="60"  y1="260" x2="560" y2="260" stroke="#1A1A1A" stroke-width="1.2"/>
  <line x1="60"  y1="40"  x2="60"  y2="260" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="570" y="265" font-size="14" fill="#1A1A1A">t</text>
  <text x="40"  y="40"  font-size="14" fill="#1A1A1A">V(t)</text>

  <!-- Linha horizontal V0 (assintota) -->
  <line x1="60"  y1="80"  x2="560" y2="80"  stroke="#3F6B85" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="500" y="73"  font-size="12" fill="#3F6B85" font-style="italic">V₀</text>

  <!-- Linha horizontal V0(1 - 1/e) ≈ 0.632 V0 em y=80+(260-80)*(1-0.632)= 80+66= 146 -->
  <line x1="60"  y1="146" x2="220" y2="146" stroke="#E8A33D" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="139" font-size="11" fill="#E8A33D">0.632 V₀</text>

  <!-- Curva: V(t) = V0 (1 - exp(-t/tau)). Mapping: x=60+t·100, y=260-(180·(1-exp(-t/tau))).
       Tomando tau=1.6, calculamos pontos. -->
  <path d="M 60 260
           Q 90 240 110 220
           Q 140 200 170 180
           Q 210 158 240 140
           Q 280 122 310 110
           Q 350 100 380 95
           Q 420 89 450 86
           Q 490 83 520 82
           L 555 81"
        stroke="#1F3A4D" stroke-width="2.5" fill="none"/>

  <!-- Marca em t=tau onde V = 0.632 V0 -->
  <line x1="220" y1="255" x2="220" y2="270" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="208" y="285" font-size="12" fill="#1A1A1A">τ=RC</text>
  <circle cx="220" cy="146" r="5" fill="#E8A33D" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Origem -->
  <text x="48" y="275" font-size="11" fill="#1A1A1A">0</text>

  <!-- Equação no canto superior direito -->
  <text x="320" y="60" font-size="14" fill="#1F3A4D" font-style="italic">V̇ = (V₀ − V) / τ</text>
  <text x="320" y="80" font-size="12" fill="#1A1A1A">V(t) = V₀(1 − e⁻ᵗ/τ)</text>

  <!-- Setas indicando que τ é tempo de meia-vida -->
  <path d="M 65 260 L 215 146" stroke="#D45A1A" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.6"/>

  <text x="65" y="200" font-size="11" fill="#D45A1A" font-style="italic">63%</text>
  <text x="65" y="214" font-size="11" fill="#D45A1A" font-style="italic">em t=τ</text>
</svg>
